name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Aucun build : on publie uniquement les fichiers du site (pas les notes du dépôt).
      - name: Préparer le site
        run: |
          mkdir _site
          cp -r index.html 404.html robots.txt sitemap.xml CNAME .nojekyll assets mentions-legales confidentialite _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
